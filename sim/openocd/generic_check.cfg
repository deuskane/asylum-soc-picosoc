#-----------------------------------------------------------------------------
# Title      : OpenOCD co-simulation of picosoc.cfg on a discovered JTAG chain
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : generic_check.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 script of sim_*_openocd_generic without GDB
#              (tb_PicoSoC_openocd, debug_mux_sel_i 10) : generic.cfg
#              (remote_bitbang.cfg, then picosoc.cfg without picosoc_chain :
#              the chain discovered, TAPs and targets created, init), then
#              checks against the chain of the testbench (PICOSOC_CHAIN of
#              cosim.cfg : chip, TAP, IDCODE of each TAP from TDO, from the
#              generics) :
#              * the number of TAPs, the IDCODE of each TAP (from TDO) ;
#              * a riscv target chip.tap for each CPU TAP, in the order of
#                the chain, on its TAP ;
#              * each target examined by init, halted and resumed ;
#              * with the injection / status TAP : picosoc_inject 0 reads
#                no difference flag.
#              Prints "SCENARIO PASS" or "SCENARIO FAIL", then shutdown.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
#-----------------------------------------------------------------------------

source [file join [file dirname [info script]] generic.cfg]

# check, scenario_end : rbb/check.tcl of the co-simulation kit
source rbb/check.tcl

# Chain of the testbench : chip, TAP, IDCODE of each TAP, from TDO
set expected [string tolower $::env(PICOSOC_CHAIN)]

# TAPs from TDO : IDCODE ; the CPU TAPs (target name, TAP)
set taps [jtag names]
set cpus {}
check "number of TAPs" [format %x [llength $taps]] [expr {[llength $expected] / 3}]
foreach dotted $taps {chip tap id} $expected {
    check "TAP $dotted ($chip.$tap) : IDCODE" [format %08x [jtag cget $dotted -idcode]] $id
    if {[string match cpu* $tap]} {
        lappend cpus $chip.$tap $dotted
    }
}

# riscv targets : one per CPU TAP, in the order of the chain
check "number of targets" [format %x [llength [target names]]] [expr {[llength $cpus] / 2}]
foreach target [target names] {name dotted} $cpus {
    set on ""
    catch {set on [$target cget -chain-position]}
    check "target $target on $on (expected $name on $dotted)" [expr {$target eq $name && $on eq $dotted}] 0x1
}

# riscv targets : examined by init, halted (wait up to 60 s), resumed
foreach target [target names] {
    targets $target
    check "$target : examined" [$target was_examined] 0x1
    halt 60000
    check "$target : halted"   [expr {[$target curstate] eq "halted"}] 0x1
    resume
    check "$target : running"  [expr {[$target curstate] eq "running"}] 0x1
}

# Injection / status TAP in the chain : found by the discovery
# (picosoc_inject fails without it), no error injected, no difference flag
if {[lsearch $expected 0x10003001] >= 0} {
    check "picosoc_inject 0 on $picosoc_inject_tap" [picosoc_inject 0] 0x0
}

# Short commands of picosoc_cmds.tcl on the first user CPU : status, select,
# stop / run, halt_cause, read_mem / write_mem (the RAM of the firmware, the
# word written back unchanged : a running CPU is halted for the access)
set cpu [picosoc_cpu user]
check "picosoc_cmds : status, one line per CPU" [expr {[llength [split [status] \n]] == [llength [target names]]}] 0x1
check "picosoc_cmds : select user" [expr {[select user] eq "selected : $cpu"}] 0x1
regexp {:\s*([0-9a-fA-F]+)} [read_mem 0x80000040] -> word
write_mem 0x80000040 0x$word
regexp {:\s*([0-9a-fA-F]+)} [read_mem 0x80000040] -> again
check "picosoc_cmds : read_mem / write_mem on a running CPU (word unchanged)" [expr {$again eq $word && [$cpu curstate] eq "running"}] 0x1
stop user
check "picosoc_cmds : stop user" [expr {[$cpu curstate] eq "halted"}] 0x1
check "picosoc_cmds : halt_cause (haltreq)" [string match "cause=3 *" [halt_cause user]] 0x1
check "picosoc_cmds : regs" [expr {[llength [split [regs] \n]] == 9}] 0x1
run user
check "picosoc_cmds : run user" [expr {[$cpu curstate] eq "running"}] 0x1

scenario_end
