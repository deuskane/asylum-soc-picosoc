# Description: OpenOCD 0.12, remote_bitbang adapter on 127.0.0.1:9824, then
#              the JTAG chain (picosoc.cfg, next to this file) :
#              * co-simulation (tb_PicoSoC_openocd) : rbb_server.c of the kit
#                asylum:verification:openocd, port 9824, debug_mux_sel_i 10
#                (PIN mode) and 11 (BYTE mode) ;
#              * board, debug_mux_sel_i 11 (JTAG over the UART) : socat
#                between the port 9824 and the serial port (README).
