#-----------------------------------------------------------------------------
# Title      : OpenOCD co-simulation of the JTAG chain of 4 TAPs of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : chain.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 script of sim_soc3x2_wardrv_fsm_c_user_openocd_chain
#              (tb_PicoSoC_openocd, debug_mux_sel_i 10, no GDB) : the chain
#              of 4 TAPs (2 user clusters with USER_CPU_DEBUG_ENABLE,
#              SUPERVISOR_CPU_DEBUG_ENABLE, DEBUG_ENABLE) in picosoc_chain,
#              then remote_bitbang.cfg (adapter) and picosoc.cfg (TAPs with
#              -expected-id, a riscv target for each CPU, init), both of
#              tools/openocd, copied next to this file in openocd/ of the
#              work root. Checks :
#              * the IDCODE of every TAP read by the scan of the chain of
#                init (Test-Logic-Reset) is its -expected-id ;
#              * the IDCODE instruction of every TAP, the others in BYPASS ;
#              * the 3 riscv targets examined by init, each halted and
#                resumed.
#              Prints "SCENARIO PASS" or "SCENARIO FAIL", then shutdown.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-25  1.0      mrosiere Created
# 2026-11-26  1.1      mrosiere picosoc.cfg sourced here (remote_bitbang.cfg
#                               is the adapter only)
#-----------------------------------------------------------------------------

# From TDO : chip, TAP, IDCODE
set picosoc_chain {
    picosoc    inject 0x10003001
    supervisor cpu    0x10002001
    user       cpu1   0x10011001
    user       cpu0   0x10001001
}

source [file join [file dirname [info script]] remote_bitbang.cfg]
source [file join [file dirname [info script]] picosoc.cfg]

# check, scenario_end : rbb/check.tcl of the co-simulation kit
source rbb/check.tcl

# No poll of the riscv targets between an IR scan and its DR scan
# (picosoc_inject in picosoc.cfg)
poll off

# IDCODEs of the scan of the chain (scan_chain : #, TapName, Enabled,
# IdCode, Expected, ...)
foreach line [lrange [split [scan_chain] \n] 2 end] {
    if {[llength $line] < 5} {
        continue
    }
    lassign $line num tap enabled idcode expected
    check "$tap : IDCODE of the scan of the chain" [string range $idcode 2 end] $expected
    set expected_id($tap) $expected
}

# IDCODE instruction of each TAP
foreach tap [jtag names] {
    irscan $tap 0x01
    check "$tap : IDCODE instruction" [drscan $tap 32 0] $expected_id($tap)
}

poll on

# riscv targets : examined by init, halted (wait up to 60 s), resumed
foreach target [target names] {
    targets $target
    check "$target : examined" [$target was_examined] 0x1
    halt 60000
    check "$target : halted"   [expr {[$target curstate] eq "halted"}] 0x1
    resume
    check "$target : running"  [expr {[$target curstate] eq "running"}] 0x1
}

scenario_end
