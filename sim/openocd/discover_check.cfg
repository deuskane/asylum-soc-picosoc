#-----------------------------------------------------------------------------
# Title      : OpenOCD co-simulation of the discovery of the JTAG chain
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : discover_check.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 script of sim_*_openocd_discover
#              (tb_PicoSoC_openocd, debug_mux_sel_i 10, no GDB) :
#              remote_bitbang.cfg, then discover.cfg (both of tools/openocd,
#              copied next to this file in openocd/ of the work root) with
#              its printed lines captured. Checks them against the chain of
#              the testbench (PICOSOC_CHAIN of cosim.cfg : chip, TAP, IDCODE
#              of each TAP from TDO, from the generics) :
#              * the number of TAPs of the line "... : <n> TAP(s) ..." ;
#              * the IDCODE of each line "TAP <k> : IDCODE <idcode> ..." ;
#              * the line "set picosoc_chain {...}" is the chain of the
#                testbench.
#              Prints "SCENARIO PASS" or "SCENARIO FAIL", then shutdown.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
#-----------------------------------------------------------------------------

source [file join [file dirname [info script]] remote_bitbang.cfg]

# check, scenario_end : rbb/check.tcl of the co-simulation kit
source rbb/check.tcl

# Chain of the testbench : chip, TAP, IDCODE of each TAP, from TDO
set expected [string trim [string tolower $::env(PICOSOC_CHAIN)]]

# discover.cfg ends with shutdown : a command that does nothing while it
# runs, so that its printed lines can be checked
set discover [file join [file dirname [info script]] discover.cfg]
rename shutdown discover_shutdown
proc   shutdown {} {}
set    lines [split [capture "source $discover"] \n]
rename shutdown {}
rename discover_shutdown shutdown

# Printed lines : number of TAPs, IDCODE of each TAP, picosoc_chain
set count  -1
set idcode {}
set chain  ""
foreach line $lines {
    regexp {JTAG chain : ([0-9]+) TAP} $line -> count
    if {[regexp {^TAP [0-9]+ : IDCODE (0x[0-9a-f]+)} $line -> id]} {
        lappend idcode $id
    }
    regexp {^set picosoc_chain \{(.*)\}} $line -> chain
}

check "number of TAPs" [format %x $count] [expr {[llength $expected] / 3}]
set k 0
foreach {chip tap id} $expected {
    set got [lindex $idcode $k]
    if {$got eq ""} {
        set got 0
    }
    check "TAP $k ($chip.$tap) : IDCODE" [format %08x $got] $id
    incr k
}
if {[join $chain " "] eq [join $expected " "]} {
    echo "OK   : set picosoc_chain {$chain}"
} else {
    echo "FAIL : set picosoc_chain {$chain} instead of {$expected}"
    set fail 1
}

scenario_end
