#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the JTAG chain of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : picosoc.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: JTAG chain of PicoSoC_top, after the lines of the adapter :
#              co-simulation (remote_bitbang.cfg, which sources this file) or
#              board (debug_mux_sel_i 10 : FTDI cable ; debug_mux_sel_i 11 :
#              remote_bitbang.cfg through socat), see the README.
#              Chain of the co-simulation (generics of tb_PicoSoC_openocd) :
#              debugger of the user CPU (USER_CPU_DEBUG_ENABLE), injection /
#              status TAP (DEBUG_ENABLE). OpenOCD lists the TAPs from TDO :
#              TDI -> user CPU -> [supervisor CPU] -> injection / status
#              TAP -> TDO. Remove the lines of an absent TAP ; the supervisor
#              CPU (SUPERVISOR_CPU_DEBUG_ENABLE) between the two :
#                jtag newtap supervisor cpu -irlen 5 -expected-id 0x10002001
#                target create supervisor.cpu riscv -chain-position supervisor.cpu
#              (GDB port 3334)
#              picosoc_inject <errors> : INJECT (error injection, difference
#              flags) of the injection / status TAP.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-24  1.0      mrosiere Created
#-----------------------------------------------------------------------------

# No TRST* / SRST pin : "reset" uses dmcontrol.ndmreset of the debugger
reset_config none

# From TDO : injection / status TAP, then the user CPU (5-bit IR each)
jtag newtap picosoc inject -irlen 5 -expected-id 0x10003001
jtag newtap user    cpu    -irlen 5 -expected-id 0x10001001
target create user.cpu riscv -chain-position user.cpu

# A simulation (and JTAG over the UART) is much slower than a JTAG probe
riscv set_command_timeout_sec 120
riscv set_reset_timeout_sec 300

# A memory access that fails is an error for GDB (not a read of zeros)
gdb_report_data_abort enable

gdb_port    3333
tcl_port    6666
telnet_port disabled

# INJECT of the injection / status TAP : errors injected (bit i in CPU i,
# while the value stays), returns the difference flags (bit 0 CPU0 vs CPU1,
# 1 CPU1 vs CPU2, 2 CPU2 vs CPU0). No poll of the riscv target between the
# IR and the DR scan : its scans select its own IR (DMI) again, and OpenOCD
# 0.12 then stops on the DR scan of a TAP whose IR is no longer selected.
proc picosoc_inject {errors} {
    poll off
    irscan picosoc.inject 0x02
    set diff [drscan picosoc.inject 3 $errors]
    poll on
    return $diff
}

init
