#-----------------------------------------------------------------------------
# Title      : OpenOCD co-simulation of the HWLA captures over JTAG
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : hwla_check.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 script of sim_*_openocd_hwla (tb_PicoSoC_openocd,
#              HWLA_LINK "jtag", debug_mux_sel_i 10, no GDB) : generic.cfg
#              (remote_bitbang.cfg, then picosoc.cfg without picosoc_chain :
#              the chain discovered, the TAPs named from their IDCODE,
#              jtag_axis.tcl of asylum-debug-jtag copied next to it by the
#              hook hwla_copy), then checks against the chain of the
#              testbench (PICOSOC_CHAIN of cosim.cfg) :
#              * picosoc_chain (the discovered chain) is the chain of the
#                testbench : the TAP of IDCODE 0x10004001 named picosoc hwla ;
#              * picosoc_hwla_status before the error : HWLA armed ; its
#                TAP TX only, 8-bit words, nothing to read ;
#              * picosoc_inject : an error in CPU1 (the difference flag
#                triggers the HWLA ; the supervisor resets the user SoC,
#                which clears the flag, again while INJECT holds the
#                request : one capture only, the next errors come while it
#                waits) ;
#              * picosoc_hwla_status : HWLA triggered and sending, the TX
#                FIFO full : a capture is waiting ;
#              * picosoc_hwla_dump hwla.bin 1 PICOSOC_HWLA_BYTES (the size of
#                a capture, from the testbench) : every byte read, the file
#                has them (hwla2vcd.py decodes it in the hook hwla_vcd) ;
#              * picosoc_hwla_status after the dump : HWLA armed again,
#                nothing to read.
#              Prints "SCENARIO PASS" or "SCENARIO FAIL", then shutdown.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-27  1.0      mrosiere Created
#-----------------------------------------------------------------------------

source [file join [file dirname [info script]] generic.cfg]

# check, scenario_end : rbb/check.tcl of the co-simulation kit
source rbb/check.tcl

# Check of a string : OK / FAIL line as check
proc check_string {name got exp} {
    global fail
    if {$got eq $exp} {
        echo "OK   : $name : $got"
    } else {
        echo "FAIL : $name : $got instead of $exp"
        set fail 1
    }
}

# Discovered chain : chip, TAP, IDCODE of each TAP from TDO, as the testbench
set expected [string trim [string tolower $::env(PICOSOC_CHAIN)]]
check_string "picosoc_chain (discovered)" [string tolower [join $picosoc_chain " "]] [join $expected " "]
check "picosoc_hwla_tap $picosoc_hwla_tap : IDCODE" [format %08x [jtag cget $picosoc_hwla_tap -idcode]] 0x10004001

# picosoc_hwla_status (8 switches, 8 + 8 LEDs : the generics of
# tb_PicoSoC_openocd) read until it is the expected one (at most n times,
# runtest 100 between two reads), then checked
proc check_hwla_status {name exp {n 100}} {
    for {set i 0} {$i < $n} {incr i} {
        set status [picosoc_hwla_status 8 8 8]
        if {$status eq $exp} {
            break
        }
        runtest 100
    }
    check_string "picosoc_hwla_status $name" $status $exp
}

set flags_armed   "hwla_arm=0x1 hwla_armed=0x1 hwla_triggered=0x0 hwla_sending=0x0"
set flags_sending "hwla_arm=0x1 hwla_armed=0x0 hwla_triggered=0x1 hwla_sending=0x1"

# Before the error : HWLA armed, no capture
check_hwla_status "before the error" \
    "$flags_armed tx_enable=1 tx_empty=1 tx_full=0 rx_enable=0 data_width=8 : nothing to read" 1

# Error in CPU1 : INJECT 1, then 0 (while INJECT holds the request, the trap
# is set again after each reset of the user SoC by the supervisor : one
# error or more). The first difference flag triggers the HWLA
check "picosoc_inject 0x2 : no difference flag before" [picosoc_inject 0x2] 0x0
picosoc_inject 0x0

# The capture comes : post-trigger samples, then the HWLA sends the
# capture, which waits in the TX FIFO (full) and in the RAM of the HWLA
check_hwla_status "after the error" \
    "$flags_sending tx_enable=1 tx_empty=0 tx_full=1 rx_enable=0 data_width=8 : a capture is waiting"

# The capture : PICOSOC_HWLA_BYTES bytes in hwla.bin
set bytes $::env(PICOSOC_HWLA_BYTES)
check "picosoc_hwla_dump hwla.bin : bytes read" [format %x [picosoc_hwla_dump hwla.bin 1 $bytes 600]] $bytes
check "hwla.bin : size" [format %x [file size hwla.bin]] $bytes

# The supervisor reset the user SoC (no difference flag any more) : the
# HWLA armed again, no second capture
check_hwla_status "after the dump" \
    "$flags_armed tx_enable=1 tx_empty=1 tx_full=0 rx_enable=0 data_width=8 : nothing to read"

scenario_end
