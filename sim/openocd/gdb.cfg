#-----------------------------------------------------------------------------
# Title      : OpenOCD side of the GDB scenario of the PicoSoC co-simulations
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : gdb.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12 configuration of sim_*_openocd_jtag and
#              _sim_*_openocd_bitbang (tb_PicoSoC_openocd, GDB scenario
#              picosoc.py) : adapter remote_bitbang.cfg, then picosoc.cfg
#              (tools/openocd, copied next to this file in openocd/ of the
#              work root) with the chain given (injection / status TAP,
#              user CPU : the line printed by discover.cfg), as on the
#              board :
#                openocd -f remote_bitbang.cfg -c "set picosoc_chain {...}" -f picosoc.cfg
#              The hook rbb/cosim.sh of the kit takes one file. The chain
#              discovered : generic.cfg.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
# 2026-11-26  1.1      mrosiere Chain given (picosoc.cfg has no default
#                               chain)
#-----------------------------------------------------------------------------

# From TDO : chip, TAP, IDCODE
set picosoc_chain {
    picosoc inject 0x10003001
    user    cpu0   0x10001001
}

source [file join [file dirname [info script]] remote_bitbang.cfg]
source [file join [file dirname [info script]] picosoc.cfg]
