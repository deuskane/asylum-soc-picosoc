name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  nonreg-sim-wardrv_fsm:
    # Call the workflow from CI repo
    uses: deuskane/asylum-ci/.github/workflows/vhdl-ci.yml@main
    with:
      nonreg_type: sim
      targets_filter: wardrv_fsm

