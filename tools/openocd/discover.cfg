#-----------------------------------------------------------------------------
# Title      : OpenOCD discovery of the JTAG chain of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : discover.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12, after an adapter file :
#                openocd -f <adapter>.cfg -f discover.cfg
#              Declares no TAP and no target : picosoc_discover of
#              discover.tcl (shared with picosoc.cfg) probes the chain
#              (jtag init, TAPs auto0.tap, auto1.tap ... from TDO) and
#              prints the number of TAPs, the IDCODE and the PicoSoC name of
#              each TAP ; then this file prints the line
#              "set picosoc_chain {...}" (to give the chain to picosoc.cfg
#              explicitly, its TAPs then checked with -expected-id), then
#              shutdown. Names (discover.tcl) :
#                0x10001001 + i x 0x10000 : user CPU of cluster i (user cpu<i>)
#                0x10002001               : supervisor CPU (supervisor cpu)
#                0x10003001               : injection / status TAP
#                                           (picosoc inject)
#                0x10004001               : jtag_axis of the HWLA captures
#                                           (picosoc hwla)
#                any other IDCODE         : unknown tap<k>
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
# 2026-11-26  1.1      mrosiere picosoc_discover of discover.tcl (shared with
#                               picosoc.cfg) : jtag init, no init
# 2026-11-27  1.2      mrosiere picosoc hwla (comment)
#-----------------------------------------------------------------------------

source [file join [file dirname [info script]] discover.tcl]

set chain [picosoc_discover]
echo "set picosoc_chain {$chain}"

shutdown
