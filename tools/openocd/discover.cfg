#-----------------------------------------------------------------------------
# Title      : OpenOCD discovery of the JTAG chain of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : discover.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12, after an adapter file :
#                openocd -f <adapter>.cfg -f discover.cfg
#              Declares no TAP and no target : init probes the chain after
#              Test-Logic-Reset (TAPs auto0.tap, auto1.tap ... from TDO, the
#              IDCODE of each TAP read from TDO). Prints the number of TAPs,
#              the IDCODE and the PicoSoC name of each TAP, then the line
#              "set picosoc_chain {...}" to give to picosoc.cfg, then
#              shutdown. PicoSoC IDCODEs (PICOSOC_JTAG_IDCODE_* of
#              PicoSoC_pkg) :
#                0x10001001 + i x 0x10000 : user CPU of cluster i (user cpu<i>)
#                0x10002001               : supervisor CPU (supervisor cpu)
#                0x10003001               : injection / status TAP
#                                           (picosoc inject)
#              Any other IDCODE is named "unknown tap<k>" (picosoc.cfg
#              declares a 5-bit IR) ; a TAP without IDCODE (BYPASS after
#              Test-Logic-Reset) reads 0x00000000.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
#-----------------------------------------------------------------------------

# Chip and TAP of a PicoSoC IDCODE (the names of picosoc.cfg), empty if the
# IDCODE is not one of PicoSoC
proc picosoc_tap {idcode} {
    if {$idcode == 0x10003001} {
        return "picosoc inject"
    }
    if {$idcode == 0x10002001} {
        return "supervisor cpu"
    }
    # 0x10001001 + i x 0x10000 : cluster i in the bits 27 to 16
    if {($idcode & 0xf000ffff) == 0x10001001} {
        return "user cpu[expr {($idcode >> 16) & 0xfff}]"
    }
    return ""
}

# No TAP declared : init probes the chain
init

set taps  [jtag names]
set chain {}
echo "PicoSoC JTAG chain : [llength $taps] TAP(s), from TDO"
set k 0
foreach tap $taps {
    set idcode [format 0x%08x [jtag cget $tap -idcode]]
    set name   [picosoc_tap $idcode]
    if {$name eq ""} {
        set name "unknown tap$k"
    }
    echo "TAP $k : IDCODE $idcode : [join $name .]"
    lappend chain {*}$name $idcode
    incr k
}
if {$k == 0} {
    echo "No TAP : check the cable, debug_mux_sel_i (10 or 11) and the bitstream"
}
echo "set picosoc_chain {$chain}"

shutdown
