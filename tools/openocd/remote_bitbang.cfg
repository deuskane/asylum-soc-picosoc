#-----------------------------------------------------------------------------
# Title      : OpenOCD remote_bitbang adapter of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : remote_bitbang.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12, adapter only : remote_bitbang on 127.0.0.1:9824.
#              Then a chain file :
#                openocd -f remote_bitbang.cfg -f picosoc.cfg
#                openocd -f remote_bitbang.cfg -f discover.cfg
#              * board, debug_mux_sel_i 11 (JTAG over the UART) : socat
#                between the port 9824 and the serial port (README) ;
#              * co-simulation (tb_PicoSoC_openocd) : rbb_server.c of the kit
#                asylum:verification:openocd, port 9824, debug_mux_sel_i 10
#                (PIN mode) and 11 (BYTE mode).
#              adapter speed has no effect : the speed is the baud rate of
#              the serial port (JTAG_BAUD_RATE).
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-24  1.0      mrosiere Created
# 2026-11-26  1.1      mrosiere Adapter only (picosoc.cfg no longer sourced)
# 2026-11-26  1.2      mrosiere transport select jtag (remote_bitbang also offers
#                               SWD in recent OpenOCD builds, e.g. xPack)
#-----------------------------------------------------------------------------

adapter driver remote_bitbang
transport select jtag
remote_bitbang host 127.0.0.1
remote_bitbang port 9824
