#-----------------------------------------------------------------------------
# Title      : OpenOCD FT232R adapter of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : ft232r.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12, adapter only : a USB-UART cable with an FT232R
#              (TXD, RXD, RTS#, CTS#, 3.3V ; e.g. DSD TECH SH-U09G) as a JTAG
#              probe, driver ft232r (synchronous bitbang : the ftdi driver
#              needs an MPSSE chip, the FT232R has none). Then a chain file :
#                openocd -f ft232r.cfg -f picosoc.cfg
#                openocd -f ft232r.cfg -f discover.cfg
#              FPGA in mode 10 (debug_mux_sel_i, JTAG pins). The UART wiring
#              of the cable is kept (NG-MEDIUM : TP2 pins 2 to 5) :
#                cable TXD  -> uart_rx_i     = TCK (TP2 pin 2)
#                cable RXD  -> uart_tx_io    = TDI (TP2 pin 3)
#                cable RTS# <- uart_cts_b_io = TDO (TP2 pin 4)
#                cable CTS# -> uart_rts_b_io = TMS (TP2 pin 5)
#              In bitbang mode RXD and CTS# are outputs of the cable, RTS#
#              an input. TCK below FSYS_INT / 8 (README, JTAG timing).
#              When OpenOCD quits, restore_serial gives the cable back to
#              the serial driver (UART modes 00, 01, 11) ; else unplug and
#              plug the cable.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created
#-----------------------------------------------------------------------------

adapter driver ft232r
ft232r vid_pid 0x0403 0x6001

# GPIO of each JTAG signal : tck tms tdi tdo
ft232r jtag_nums TXD CTS RXD RTS

# At exit : bitbang off, TXD, RTS# and DTR# outputs (the serial port)
ft232r restore_serial 0x0015

adapter speed 100
