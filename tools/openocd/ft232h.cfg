#-----------------------------------------------------------------------------
# Title      : OpenOCD FT232H adapter of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : ft232h.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: OpenOCD 0.12, adapter only : an FTDI MPSSE cable, FT232H
#              (FT2232H : vid_pid 0x0403 0x6010, channel A), driver ftdi.
#              Then the chain file :
#                openocd -f ft232h.cfg -f picosoc.cfg
#              FPGA in mode 10 (debug_mux_sel_i, JTAG pins). JTAG pinout of
#              the MPSSE, the UART pinout of the same cable (NG-MEDIUM : TP2
#              pins 2 to 5) :
#                AD0 TCK (TXD)  -> uart_rx_i
#                AD1 TDI (RXD)  -> uart_tx_io
#                AD2 TDO (RTS#) <- uart_cts_b_io
#                AD3 TMS (CTS#) -> uart_rts_b_io
#              TCK below FSYS_INT / 8 (README, JTAG timing).
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-26  1.0      mrosiere Created from the command line of the README
#-----------------------------------------------------------------------------

adapter driver ftdi
transport select jtag
ftdi vid_pid 0x0403 0x6014

# Values and directions of AD0..AD15 : TCK, TDI, TMS outputs, TMS high
ftdi layout_init 0x0008 0x000b

adapter speed 500
