#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the JTAG chain of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : picosoc.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: JTAG chain of PicoSoC_top, after an adapter file :
#                openocd -f <adapter>.cfg -f picosoc.cfg
#              board : ft232r.cfg, ft232h.cfg (debug_mux_sel_i 10) or
#              remote_bitbang.cfg through socat (11), see the README ;
#              co-simulation : remote_bitbang.cfg (sim/openocd/*.cfg).
#              JTAG chain : the list picosoc_chain (chip, TAP, IDCODE of
#              each TAP, from TDO) :
#              * not set (default) : discovered, any PicoSoC bitstream
#                works without argument. picosoc_discover of discover.tcl
#                (shared with discover.cfg) probes the chain (jtag init),
#                prints it and names each TAP from its IDCODE ; the TAPs
#                keep the names of the OpenOCD autoprobe (auto0.tap ...),
#                the targets get the PicoSoC names (user.cpu0 ...) ;
#              * set before this file (-c "set picosoc_chain {...}", the
#                line printed by discover.cfg ; chain.cfg, the 4 TAPs of
#                sim_soc3x2_*_openocd_chain) : the TAPs chip.tap declared
#                with their -expected-id (5-bit IR), checked by init.
#              OpenOCD lists the TAPs from TDO : TDI -> user CPU of cluster
#              0, 1 ... -> supervisor CPU -> HWLA (jtag_axis, HWLA_LINK
#              "jtag") -> injection / status TAP -> TDO.
#              A riscv target chip.tap for each TAP cpu*, GDB ports from
#              3333 in the order of the list. An unknown TAP stays in the
#              chain without target (warning).
#              picosoc_inject <errors> : INJECT (error injection, difference
#              flags) of the injection / status TAP.
#              picosoc_status : STATUS of the injection / status TAP (LEDs,
#              switches, resets, flags of the HWLA).
#              HWLA : picosoc_hwla_status (flags of the HWLA and, with
#              HWLA_LINK "jtag", the CONFIG of its jtag_axis TAP
#              picosoc.hwla : a capture waiting or not), picosoc_hwla_dump <file> [captures
#              [capture_bytes [timeout]]] (the bytes of the captures, a
#              binary file for tools/hwla2vcd.py of asylum-debug-hwla). They
#              use tools/openocd/jtag_axis.tcl of asylum-debug-jtag, sourced
#              from jtag_axis_tcl (-c "set jtag_axis_tcl <path>" before this
#              file), else from this directory (co-simulation), else from
#              ../../../asylum-debug-jtag (the ip/ directory of
#              asylum-project).
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-24  1.0      mrosiere Created
# 2026-11-25  1.1      mrosiere Chain given by picosoc_chain
# 2026-11-26  1.2      mrosiere After an adapter file (tools/openocd) ;
#                               picosoc_chain printed by discover.cfg
# 2026-11-26  1.3      mrosiere Chain discovered without picosoc_chain
#                               (discover.tcl) ; no default chain
# 2026-11-26  1.4      mrosiere picosoc_status : STATUS of the injection /
#                               status TAP (LEDs, switches, resets)
# 2026-11-26  1.5      mrosiere picosoc_poll : no error without target
# 2026-11-26  1.6      mrosiere picosoc_inject : the trap of the error
#                               injection (comments)
# 2026-11-27  1.7      mrosiere picosoc_hwla_status, picosoc_hwla_dump (HWLA
#                               captures through jtag_axis, HWLA_LINK "jtag") ;
#                               picosoc_status : flags of the HWLA
#-----------------------------------------------------------------------------

# No TRST* / SRST pin : "reset" uses dmcontrol.ndmreset of the debugger
reset_config none

# The chain : given (TAPs checked against their IDCODE by init) or
# discovered (TAPs of the autoprobe)
if {[info exists picosoc_chain]} {
    foreach {chip tap idcode} $picosoc_chain {
        jtag newtap $chip $tap -irlen 5 -expected-id $idcode
    }
} else {
    source [file join [file dirname [info script]] discover.tcl]
    set picosoc_chain [picosoc_discover]
}

# A riscv target for each CPU debug unit ; the TAPs of jtag names in the
# order of picosoc_chain (from TDO)
set picosoc_inject_tap ""
set picosoc_hwla_tap   ""
foreach dotted [jtag names] {chip tap idcode} $picosoc_chain {
    if {[string match cpu* $tap]} {
        target create $chip.$tap riscv -chain-position $dotted
    } elseif {"$chip.$tap" eq "picosoc.inject"} {
        set picosoc_inject_tap $dotted
    } elseif {"$chip.$tap" eq "picosoc.hwla"} {
        set picosoc_hwla_tap $dotted
    } elseif {$chip eq "unknown"} {
        echo "Warn : TAP $dotted (IDCODE $idcode) : not a PicoSoC TAP, no target"
    }
}

# A simulation (and JTAG over the UART) is much slower than a JTAG probe
# (the riscv commands exist once a riscv target is created)
if {[target names] ne ""} {
    riscv set_command_timeout_sec 120
    riscv set_reset_timeout_sec 300
}

# A memory access that fails is an error for GDB (not a read of zeros)
gdb_report_data_abort enable

gdb_port    3333
tcl_port    6666
telnet_port 4444

# poll of the targets off / on around the scans of the injection / status
# TAP ; the command poll exists only when the chain has a target (OpenOCD
# registers it with the first target)
proc picosoc_poll {state} {
    if {[info commands poll] ne ""} {
        poll $state
    }
}

# INJECT of the injection / status TAP : errors requested (bit i in CPU i),
# returns the difference flags read before the write (bit 0 CPU0 vs CPU1,
# 1 CPU1 vs CPU2, 2 CPU2 vs CPU0, sticky until the reset of the user SoC).
# A request sets the trap of CPU i (PicoSoC_inject) : the error stays until
# the compare flags CPU i, even if the bit is written back to 0 at once ;
# writing the bit back from 1 to 0 also clears the trap (without safety,
# the only way : picosoc_inject 0x1, then picosoc_inject 0x0). No poll of the riscv target between the
# IR and the DR scan : its scans select its own IR (DMI) again, and OpenOCD
# 0.12 then stops on the DR scan of a TAP whose IR is no longer selected.
proc picosoc_inject {errors} {
    global picosoc_inject_tap
    picosoc_poll off
    irscan $picosoc_inject_tap 0x02
    set diff [drscan $picosoc_inject_tap 3 $errors]
    picosoc_poll on
    return $diff
}

# STATUS of the injection / status TAP (IR 0x03), from the LSB : led0_o,
# led1_o, led_diff_o (3 bits : the LEDs of the supervisor, its count of the
# resets of the user SoC), switch_i, the resets of the user SoC and of
# the supervisor SoC (1 : running), then the flags of the HWLA : arm (tied
# to 1), armed (waiting for the trigger), triggered (capture not yet
# extracted), sending (a byte of the capture offered to its link). The widths are the generics
# USER_NB_SWITCH, USER_NB_LED0, USER_NB_LED1 of the bitstream (NG-MEDIUM
# board : 4, 8, 8, the default arguments). Prints and returns the fields.
proc picosoc_status_decode {value {nb_switch 4} {nb_led0 8} {nb_led1 8}} {
    set v [expr {$value}]
    set fields {}
    foreach {name width} [list led0 $nb_led0 led1 $nb_led1 led_diff 3 switch $nb_switch \
                               user_running 1 supervisor_running 1 \
                               hwla_arm 1 hwla_armed 1 hwla_triggered 1 hwla_sending 1] {
        lappend fields [format "%s=0x%x" $name [expr {$v & ((1 << $width) - 1)}]]
        set v [expr {$v >> $width}]
    }
    return [join $fields " "]
}

proc picosoc_status {{nb_switch 4} {nb_led0 8} {nb_led1 8}} {
    global picosoc_inject_tap
    set width [expr {$nb_led0 + $nb_led1 + 3 + $nb_switch + 2 + 4}]
    picosoc_poll off
    irscan $picosoc_inject_tap 0x03
    set raw [drscan $picosoc_inject_tap $width 0]
    picosoc_poll on
    return [picosoc_status_decode 0x$raw $nb_switch $nb_led0 $nb_led1]
}

# Procedures of the jtag_axis TAP (jtag_axis_config, jtag_axis_pop) :
# tools/openocd/jtag_axis.tcl of asylum-debug-jtag (one copy of them), from
# jtag_axis_tcl if set, else next to this file (the co-simulations copy it
# there), else in the asylum-project tree (ip/asylum-debug-jtag)
if {![info exists jtag_axis_tcl]} {
    set jtag_axis_tcl [file join [file dirname [info script]] jtag_axis.tcl]
    if {![file exists $jtag_axis_tcl]} {
        set jtag_axis_tcl [file join [file dirname [info script]] .. .. .. asylum-debug-jtag tools openocd jtag_axis.tcl]
    }
}
if {[file exists $jtag_axis_tcl]} {
    source $jtag_axis_tcl
}

# HWLA TAP of the chain (IDCODE 0x10004001) and the procedures of
# jtag_axis.tcl, else an error
proc picosoc_hwla_check {} {
    global picosoc_hwla_tap jtag_axis_tcl
    if {$picosoc_hwla_tap eq ""} {
        error "picosoc_hwla : no HWLA TAP (IDCODE 0x10004001) in the chain : a bitstream with DEBUG_ENABLE and HWLA_LINK jtag"
    }
    if {[info commands jtag_axis_pop] eq ""} {
        error "picosoc_hwla : $jtag_axis_tcl not found : -c \"set jtag_axis_tcl <path of tools/openocd/jtag_axis.tcl of asylum-debug-jtag>\" before picosoc.cfg"
    }
}

# State of the HWLA : its flags (hwla_* of STATUS of the injection / status
# TAP, picosoc_status, with the widths of the bitstream as arguments) and,
# with HWLA_LINK "jtag", the CONFIG of its jtag_axis TAP (TX only, 8-bit
# words) : TX empty : nothing to read (no capture triggered, or the capture
# read) ; else a capture is waiting (its first bytes in the TX FIFO, the
# rest in the RAM of the HWLA until they are read). Prints and returns the
# fields and the state
proc picosoc_hwla_status {{nb_switch 4} {nb_led0 8} {nb_led1 8}} {
    global picosoc_hwla_tap
    set fields [lrange [split [picosoc_status $nb_switch $nb_led0 $nb_led1] " "] end-3 end]
    if {$picosoc_hwla_tap eq ""} {
        set state "no HWLA TAP (HWLA_LINK uart : the captures on the UART)"
    } else {
        picosoc_hwla_check
        picosoc_poll off
        set c [jtag_axis_config $picosoc_hwla_tap]
        picosoc_poll on
        foreach name {tx_enable tx_empty tx_full rx_enable data_width} {
            lappend fields [format "%s=%d" $name [dict get $c $name]]
        }
        if {[dict get $c tx_empty]} {
            set state "nothing to read"
        } else {
            set state "a capture is waiting"
        }
    }
    set status "[join $fields " "] : $state"
    echo "picosoc_hwla_status : $status"
    return $status
}

# Bytes of the HWLA captures (HWLA_LINK "jtag") popped from the TX FIFO of
# the jtag_axis TAP until captures x capture_bytes bytes are read, written to
# <file> as raw bytes (the bytes of debug_uart_tx_o with HWLA_LINK "uart") :
# python3 tools/hwla2vcd.py <file> -n ... of asylum-debug-hwla.
# capture_bytes : HWLA_DEPTH x the bytes of a sample, (probes + timestamp
# + 7) / 8 ; 704 by default : WardRV_fsm, default HWLA_* generics (64
# samples of 71 probes and a 16-bit timestamp, 11 bytes) ; OpenBlaze8 : 640.
# Waits for the trigger : stops when no byte comes for timeout seconds (10).
# Returns the number of bytes written
proc picosoc_hwla_dump {file {captures 1} {capture_bytes 704} {timeout 10}} {
    global picosoc_hwla_tap
    picosoc_hwla_check
    set total [expr {$captures * $capture_bytes}]
    set bytes {}
    set last  [clock seconds]
    picosoc_poll off
    set err [catch {
        while {[llength $bytes] < $total} {
            set words [jtag_axis_pop $picosoc_hwla_tap [expr {$total - [llength $bytes]}]]
            if {[llength $words] > 0} {
                lappend bytes {*}$words
                set last [clock seconds]
            } elseif {[clock seconds] - $last >= $timeout} {
                break
            }
        }
    } msg]
    picosoc_poll on
    if {$err} {
        error $msg
    }
    set f [open $file w]
    puts -nonewline $f [binary format c* $bytes]
    close $f
    if {[llength $bytes] < $total} {
        echo "Warn : picosoc_hwla_dump : [llength $bytes] of $total bytes in $file (no byte for $timeout s : no trigger ?)"
    } else {
        echo "picosoc_hwla_dump : $captures capture(s), $total bytes in $file"
    }
    return [llength $bytes]
}

init
