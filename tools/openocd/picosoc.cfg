#-----------------------------------------------------------------------------
# Title      : OpenOCD configuration of the JTAG chain of PicoSoC
# Project    : PicoSoC
#-----------------------------------------------------------------------------
# File       : picosoc.cfg
# Author     : mrosiere
#-----------------------------------------------------------------------------
# Description: JTAG chain of PicoSoC_top, after an adapter file :
#                openocd -f <adapter>.cfg -f picosoc.cfg
#              board : ft232r.cfg, ft232h.cfg (debug_mux_sel_i 10) or
#              remote_bitbang.cfg through socat (11), see the README ;
#              co-simulation : remote_bitbang.cfg (sim/openocd/*.cfg).
#              JTAG chain : the list picosoc_chain (chip, TAP, IDCODE of
#              each TAP, from TDO) :
#              * not set (default) : discovered, any PicoSoC bitstream
#                works without argument. picosoc_discover of discover.tcl
#                (shared with discover.cfg) probes the chain (jtag init),
#                prints it and names each TAP from its IDCODE ; the TAPs
#                keep the names of the OpenOCD autoprobe (auto0.tap ...),
#                the targets get the PicoSoC names (user.cpu0 ...) ;
#              * set before this file (-c "set picosoc_chain {...}", the
#                line printed by discover.cfg ; chain.cfg, the 4 TAPs of
#                sim_soc3x2_*_openocd_chain) : the TAPs chip.tap declared
#                with their -expected-id (5-bit IR), checked by init.
#              OpenOCD lists the TAPs from TDO : TDI -> user CPU of cluster
#              0, 1 ... -> supervisor CPU -> injection / status TAP -> TDO.
#              A riscv target chip.tap for each TAP cpu*, GDB ports from
#              3333 in the order of the list. An unknown TAP stays in the
#              chain without target (warning).
#              picosoc_inject <errors> : INJECT (error injection, difference
#              flags) of the injection / status TAP.
#-----------------------------------------------------------------------------
# Copyright (c) 2026
#-----------------------------------------------------------------------------
# Revisions  :
# Date        Version  Author   Description
# 2026-11-24  1.0      mrosiere Created
# 2026-11-25  1.1      mrosiere Chain given by picosoc_chain
# 2026-11-26  1.2      mrosiere After an adapter file (tools/openocd) ;
#                               picosoc_chain printed by discover.cfg
# 2026-11-26  1.3      mrosiere Chain discovered without picosoc_chain
#                               (discover.tcl) ; no default chain
#-----------------------------------------------------------------------------

# No TRST* / SRST pin : "reset" uses dmcontrol.ndmreset of the debugger
reset_config none

# The chain : given (TAPs checked against their IDCODE by init) or
# discovered (TAPs of the autoprobe)
if {[info exists picosoc_chain]} {
    foreach {chip tap idcode} $picosoc_chain {
        jtag newtap $chip $tap -irlen 5 -expected-id $idcode
    }
} else {
    source [file join [file dirname [info script]] discover.tcl]
    set picosoc_chain [picosoc_discover]
}

# A riscv target for each CPU debug unit ; the TAPs of jtag names in the
# order of picosoc_chain (from TDO)
set picosoc_inject_tap ""
foreach dotted [jtag names] {chip tap idcode} $picosoc_chain {
    if {[string match cpu* $tap]} {
        target create $chip.$tap riscv -chain-position $dotted
    } elseif {"$chip.$tap" eq "picosoc.inject"} {
        set picosoc_inject_tap $dotted
    } elseif {$chip eq "unknown"} {
        echo "Warn : TAP $dotted (IDCODE $idcode) : not a PicoSoC TAP, no target"
    }
}

# A simulation (and JTAG over the UART) is much slower than a JTAG probe
# (the riscv commands exist once a riscv target is created)
if {[target names] ne ""} {
    riscv set_command_timeout_sec 120
    riscv set_reset_timeout_sec 300
}

# A memory access that fails is an error for GDB (not a read of zeros)
gdb_report_data_abort enable

gdb_port    3333
tcl_port    6666
telnet_port 4444

# INJECT of the injection / status TAP : errors injected (bit i in CPU i,
# while the value stays), returns the difference flags (bit 0 CPU0 vs CPU1,
# 1 CPU1 vs CPU2, 2 CPU2 vs CPU0). No poll of the riscv target between the
# IR and the DR scan : its scans select its own IR (DMI) again, and OpenOCD
# 0.12 then stops on the DR scan of a TAP whose IR is no longer selected.
proc picosoc_inject {errors} {
    global picosoc_inject_tap
    poll off
    irscan $picosoc_inject_tap 0x02
    set diff [drscan $picosoc_inject_tap 3 $errors]
    poll on
    return $diff
}

init
